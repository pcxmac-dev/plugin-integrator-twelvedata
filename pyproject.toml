[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-integrator-twelvedata"
version = "0.2.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "Twelve Data for Liminal: currency pairs' 1-minute bars on a free Twelve Data key (8 requests a minute, 800 a day), two years back."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the class contract, plugin API 2.0: liminal-libs 1.3.0); which of its releases
# can load it is the plugin API the plugin declares (PLUGIN.api, checked when the app loads it), not this line
dependencies = ["liminal-libs>=1.4.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
twelvedata = "plugin_integrator_twelvedata"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
